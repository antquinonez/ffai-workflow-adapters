[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffai-workflow-adapters"
version = "0.2.0"
description = "External workflow adapters for FFAI — load workflows from Airtable, Google Sheets, and other tabular sources"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antonio Quinonez", email = "antquinonez@farfiner.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ffai", "workflow", "airtable", "llm", "automation"]

dependencies = [
    "ffai>=0.1.6",
    "pydantic-settings>=2.13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
airtable = [
    "pyairtable>=3.0.0",
]
csv = []
google_sheets = [
    "gspread>=6.0.0",
]
excel = [
    "openpyxl>=3.1.0",
]
ods = [
    "odfpy>=1.4.0",
]
haystack = [
    "haystack-ai>=2.0.0",
    "sentence-transformers>=2.0.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "sphinx-rtd-theme>=3.0",
]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "papermill>=2.6.0",
    "ffai-workflow-adapters[docs]",
    "odfpy>=1.4.0",
]
all = [
    "ffai-workflow-adapters[airtable]",
    "ffai-workflow-adapters[csv]",
    "ffai-workflow-adapters[excel]",
    "ffai-workflow-adapters[google_sheets]",
    "ffai-workflow-adapters[ods]",
    "ffai-workflow-adapters[haystack]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: integration tests that call real APIs and execute real workflows",
    "airtable: integration tests that require AIRTABLE_API_KEY and AIRTABLE_BASE_ID",
    "csv: tests for the CSV/TSV adapter",
    "excel: integration tests that create real Excel files and execute real workflows",
    "google_sheets: tests for the Google Sheets adapter",
    "ods: tests for the ODS adapter",
]

[tool.setuptools.packages.find]
include = ["ffai_workflow_adapters*"]
exclude = ["config*", "tests*", "_ideas*"]

[tool.ruff]
target-version = "py310"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
