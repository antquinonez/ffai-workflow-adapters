[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffai-workflow-adapters"
version = "0.1.0"
description = "External workflow adapters for FFAI — load workflows from Airtable, Google Sheets, and other tabular sources"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antonio Quinonez", email = "antquinonez@farfiner.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ffai", "workflow", "airtable", "llm", "automation"]

dependencies = [
    "ffai>=0.1.3",
]

[project.optional-dependencies]
airtable = [
    "pyairtable>=3.0.0",
]
dev = [
    "pytest",
    "pyright",
    "ruff",
]
all = [
    "ffai-workflow-adapters[airtable]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
