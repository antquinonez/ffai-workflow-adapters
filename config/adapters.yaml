adapters:
  airtable:
    api_key_env: AIRTABLE_API_KEY
    base_id_env: AIRTABLE_BASE_ID
    default_view: ""
    passthrough_columns:
      - Comments
      - Priority
      - Category
    extra_output_columns:
      run_id: "{{run_id}}"
      run_date: "{{date}}"
    input_field_map:
      Name: name
      Prompt: prompt
      Model: client
      History: history
      Temperature: temperature
      Max Tokens: max_tokens
    output_field_map:
      workflow: Workflow
      step: Step
      status: Status
      response: Response
      model: Model
      input_tokens: Input Tokens
      output_tokens: Output Tokens
      cost_usd: Cost
      duration_ms: Duration ms
      timestamp: Timestamp
    named:
      custom:
        input_field_map:
          Task: name
          Instructions: prompt
          "AI Model": client
          Context: history
          Temp: temperature
        output_field_map:
          step: Task
          response: Output
          model: "AI Model"
  csv_adapter:
    output_path: "output/results.csv"
    delimiter: ","
    passthrough_columns:
      - Comments
      - Priority
      - Category
    extra_output_columns:
      run_id: "{{run_id}}"
      run_date: "{{date}}"
    input_field_map:
      Name: name
      Prompt: prompt
      Model: client
      History: history
      Temperature: temperature
      Max Tokens: max_tokens
    output_field_map:
      workflow: Workflow
      step: Step
      status: Status
      response: Response
      model: Model
      input_tokens: Input Tokens
      output_tokens: Output Tokens
      cost_usd: Cost
      duration_ms: Duration ms
      timestamp: Timestamp
  excel:
    output_path: "output/results.xlsx"
    output_sheet: "Results"
    passthrough_columns:
      - Comments
      - Priority
      - Category
    extra_output_columns:
      run_id: "{{run_id}}"
      run_date: "{{date}}"
      batch: "demo-run"
    input_field_map:
      Name: name
      Prompt: prompt
      Model: client
      History: history
      Temperature: temperature
      Max Tokens: max_tokens
    output_field_map:
      workflow: Workflow
      step: Step
      status: Status
      response: Response
      model: Model
      input_tokens: Input Tokens
      output_tokens: Output Tokens
      cost_usd: Cost
      duration_ms: Duration ms
      timestamp: Timestamp
    named:
      custom:
        output_path: "output/results_custom.xlsx"
        output_sheet: "Custom Results"
        input_field_map:
          Task: name
          Instructions: prompt
          "AI Model": client
          Context: history
          Temp: temperature
        output_field_map:
          step: Task
          response: Output
          model: "AI Model"
  google_sheets:
    auth_method: service_account
    credentials_env: GOOGLE_SHEETS_CREDENTIALS
    authorized_user_env: GOOGLE_SHEETS_AUTHORIZED_USER
    api_key_env: GOOGLE_SHEETS_API_KEY
    output_worksheet: Results
    passthrough_columns:
      - Comments
      - Priority
      - Category
    extra_output_columns:
      run_id: "{{run_id}}"
      run_date: "{{date}}"
    input_field_map:
      Name: name
      Prompt: prompt
      Model: client
      History: history
      Temperature: temperature
      Max Tokens: max_tokens
    output_field_map:
      workflow: Workflow
      step: Step
      status: Status
      response: Response
      model: Model
      input_tokens: Input Tokens
      output_tokens: Output Tokens
      cost_usd: Cost
      duration_ms: Duration ms
      timestamp: Timestamp
  ods:
    output_path: "output/results.ods"
    output_sheet: "Results"
    passthrough_columns:
      - Comments
      - Priority
      - Category
    extra_output_columns:
      run_id: "{{run_id}}"
      run_date: "{{date}}"
    input_field_map:
      Name: name
      Prompt: prompt
      Model: client
      History: history
      Temperature: temperature
      Max Tokens: max_tokens
    output_field_map:
      workflow: Workflow
      step: Step
      status: Status
      response: Response
      model: Model
      input_tokens: Input Tokens
      output_tokens: Output Tokens
      cost_usd: Cost
      duration_ms: Duration ms
      timestamp: Timestamp
