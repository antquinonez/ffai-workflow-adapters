retry:
  max_attempts: 3
  min_wait_seconds: 1.0
  max_wait_seconds: 60.0
  exponential_base: 2.0
  exponential_jitter: true
  retry_on_status_codes:
    - 429
    - 503
    - 502
    - 504

resilience:
  rate_limit:
    requests_per_second: 5.0
    burst: 10
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_seconds: 30.0
    half_open_max_calls: 3
  batch:
    chunk_size: 10
    max_concurrency: 3
